<!doctype html><html lang="zh"><meta charset="utf-8"><title>旺崽社区图表验证</title><style>body{font-family:Arial,sans-serif;background:#f4f6fa;color:#172554;margin:30px}.row{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:white;border-radius:18px;padding:20px}h1{font-size:24px}h2{font-size:17px}</style><h1>旺崽助手 · 社区图表验证</h1><p>隔离样例：零值与缺失值、中文标签、金额单位及待办占比。</p><div id="root"></div><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import Chart from '/src/shared/ui/CommunityChart.jsx';
const e=React.createElement;const samples=[['经营待办','donut',[2,5,1,6],{labels:['待拍单','待发货','售后','库存'],colors:['#5d87ff','#49beff','#13deb9','#ffae1f'],legend:{show:false},plotOptions:{pie:{donut:{size:'72%',labels:{show:true,total:{label:'待办',formatter:()=>14}}}}}}],['销售趋势（保留缺失日）','area',[{name:'销售额',data:[10,22,null,0,18,28]}],{xaxis:{categories:['11/01','11/02','11/03','11/04','11/05','11/06']},colors:['#5d87ff'],tooltip:{y:{formatter:v=>'￥'+v.toFixed(2)}},yaxis:{min:0,labels:{formatter:v=>'￥'+v}}}],['商品分类','bar',[{name:'数量',data:[8,4,2]}],{xaxis:{categories:['家居用品','办公文具','其他']},plotOptions:{bar:{horizontal:true}},colors:['#5d87ff'],legend:{show:false}}]];
createRoot(document.getElementById('root')).render(e('div',{className:'row'},samples.map(([title,type,series,options])=>e('section',{key:title,className:'card'},e('h2',null,title),e(Chart,{type,series,options,height:250})))));
</script></html>
