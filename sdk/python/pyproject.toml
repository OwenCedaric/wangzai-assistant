[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "license-center-sdk"
version = "1.1.0"
description = "Python client SDK for License Center"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Wangzai-Source-Available"
authors = [{name = "License Center Team"}]
dependencies = [
  "cryptography>=42,<47",
]

[project.optional-dependencies]
test = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["license_sdk*"]

[tool.setuptools.package-data]
license_sdk = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
