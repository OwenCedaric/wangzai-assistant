name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/audit-public-source.mjs --tracked
      - run: node frontend/scripts/scan-secrets.mjs --all
      - run: node --test tools/audit-public-source.test.mjs desktop/src/licensing/localSelfHosting.test.js desktop/src/licensing/protectedComputeDistribution.test.js desktop/src/licensing/licenseConfig.test.js
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm run typecheck --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
  server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements-lock.txt
      - run: python -m pytest -c server/pyproject.toml server/tests
  local-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: local-api/package-lock.json
      - run: npm ci --prefix local-api --ignore-scripts
      # Intentionally retain real-evidence and existing failing checks. See
      # docs/PUBLICATION_STATUS.md; do not change these into a false green run.
      - run: npm test --prefix local-api
