name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/audit-public-source.mjs --tracked
      - run: node tools/verify-source-completeness.mjs
      - run: node frontend/scripts/scan-secrets.mjs --all
      - run: node --test tools/test-suite-boundary.test.mjs tools/audit-public-source.test.mjs desktop/src/licensing/localSelfHosting.test.js desktop/src/licensing/protectedComputeDistribution.test.js desktop/src/licensing/licenseConfig.test.js
      - run: node --test tools/verify-source-completeness.test.mjs desktop/scripts/server-source-root.test.mjs desktop/src/licensing/licenseServerBootstrap.test.js
      - run: ./tools/owned-runtime.test.ps1
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm run typecheck --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
  server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements-lock.txt
      - run: python -m pytest -c server/pyproject.toml server/tests
  local-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: local-api/package-lock.json
      - run: npm ci --prefix local-api --ignore-scripts
      # Real evidence remains mandatory in the separate release-readiness workflow.
      - run: npm run test:source --prefix local-api
  admin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --prefix admin --ignore-scripts
      - run: npm run lint --prefix admin
      - run: npm test --prefix admin
      - run: npm run build --prefix admin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements-lock.txt
      - run: python tools/smoke-admin-selfhost.py
  sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "./sdk/python[test]"
      - run: python -m ruff check sdk/python
      - run: python -m pytest -c sdk/python/pyproject.toml sdk/python/tests
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and complete profit runtime from public source
        run: docker build -f server/Dockerfile -t wangzai-source-check .
      - name: Exercise actual worker offline with no business volumes
        run: docker run --rm --network none --read-only --tmpfs /tmp --entrypoint gosu wangzai-source-check license python scripts/container-profit-smoke.py
